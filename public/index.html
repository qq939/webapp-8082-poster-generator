<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PictureText · 图文助手</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='24' font-size='24'>🖼️</text></svg>" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <span class="logo">🖼️</span>
      <div>
        <h1>PictureText</h1>
        <p class="sub">图文对话 · 8082</p>
      </div>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="chat" role="tab">对话</button>
      <button class="tab" data-tab="gallery" role="tab">图库 <span id="galleryCount" class="badge">0</span></button>
    </nav>

    <div class="rail-footer">
      <div id="status" class="status"><span class="dot"></span><span id="statusText">检查中…</span></div>
      <div class="hint">上传 / 粘贴图片后提问，走 <code>run_claude.js</code> 图文模式</div>
    </div>
  </aside>

  <main class="main">
    <!-- 对话 -->
    <section id="panel-chat" class="panel active">
      <div id="messages" class="messages">
        <div class="empty" id="emptyState">
          <div class="empty-icon">🖼️ ✍️</div>
          <h2>把图片和问题一起丢过来</h2>
          <p>支持点击选择、拖拽到输入框、或直接 <kbd>Ctrl</kbd>+<kbd>V</kbd> 粘贴截图。</p>
          <div class="samples">
            <button class="chip" data-sample="请详细描述这张图片的内容，包括主体、场景与细节。">描述图片</button>
            <button class="chip" data-sample="提取这张图片里的所有文字，保持原有排版。">提取文字</button>
            <button class="chip" data-sample="这张图有什么问题？给出可执行的改进建议。">找问题</button>
          </div>
        </div>
      </div>

      <div class="composer">
        <div id="attachment" class="attachment hidden">
          <img id="attachmentThumb" alt="待发送图片" />
          <div class="attachment-meta">
            <strong id="attachmentName">image.png</strong>
            <span id="attachmentSize"></span>
          </div>
          <button id="attachmentRemove" class="icon-btn" title="移除图片">✕</button>
        </div>

        <div class="composer-row">
          <label class="icon-btn attach" title="选择图片">
            📎
            <input id="fileInput" type="file" accept="image/*" hidden />
          </label>
          <textarea id="input" rows="1" placeholder="输入问题…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button id="send" class="send">发送</button>
        </div>
        <div class="composer-foot">
          <span id="modeHint">纯文本模式</span>
          <span id="counter"></span>
        </div>
      </div>
    </section>

    <!-- 图库 -->
    <section id="panel-gallery" class="panel">
      <div class="gallery-head">
        <h2>上传的图片</h2>
        <div class="gallery-actions">
          <input id="gallerySearch" class="search" type="search" placeholder="按文件名过滤…" />
          <button id="refreshGallery" class="ghost-btn">刷新</button>
        </div>
      </div>
      <div id="gallery" class="gallery"></div>
    </section>
  </main>
</div>

<div id="toast" class="toast"></div>
<script src="/app.js"></script>
</body>
</html>
