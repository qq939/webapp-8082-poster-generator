<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iphone18pro现货 - 横版A4商业宣传图</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #000000;
    color: #1d1d1f;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    font-weight: 400;
  }
  .a4-landscape {
    width: 297mm;
    max-width: 100%;
    aspect-ratio: 297 / 210;
    background: #ffffff;
    position: relative;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .product-side {
    background: linear-gradient(180deg, #0a0a0a 0%, #1d1d1f 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20mm;
  }
  .product-side::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70%;
    height: 70%;
    background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 70%);
    pointer-events: none;
  }
  .product-image {
    width: 100%;
    max-width: 220mm;
    height: auto;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 30px 60px rgba(0,0,0,0.6));
  }
  .product-badge {
    position: absolute;
    top: 12mm;
    left: 12mm;
    color: #f5f5f7;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1px;
    z-index: 3;
  }
  .product-badge .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: #1a7f37;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }
  .info-side {
    background: #ffffff;
    padding: 18mm 16mm;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }
  .eyebrow {
    font-size: 13px;
    color: #6e6e73;
    letter-spacing: 4px;
    margin-bottom: 8mm;
    font-weight: 500;
    text-transform: uppercase;
  }
  h1.hero-title {
    font-size: 72px;
    font-weight: 700;
    margin: 0 0 2mm 0;
    color: #1d1d1f;
    letter-spacing: -1.5px;
    line-height: 1;
  }
  .hero-subtitle {
    font-size: 28px;
    font-weight: 500;
    color: #1d1d1f;
    margin: 0 0 8mm 0;
    letter-spacing: -0.3px;
  }
  .divider {
    width: 40mm;
    height: 1px;
    background: #d2d2d7;
    margin: 0 0 8mm 0;
  }
  .description {
    font-size: 17px;
    line-height: 1.5;
    color: #424245;
    margin: 0 0 10mm 0;
    letter-spacing: -0.2px;
  }
  .price-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6mm;
    margin-bottom: 8mm;
  }
  .price-card {
    border-top: 1px solid #d2d2d7;
    padding-top: 5mm;
  }
  .storage-label {
    font-size: 13px;
    color: #6e6e73;
    margin-bottom: 2mm;
    letter-spacing: 0.5px;
    font-weight: 500;
  }
  .price-amount {
    font-size: 36px;
    font-weight: 600;
    color: #1d1d1f;
    line-height: 1;
    letter-spacing: -0.8px;
  }
  .price-amount .currency {
    font-size: 18px;
    font-weight: 500;
    margin-right: 1px;
    vertical-align: top;
    position: relative;
    top: 4px;
  }
  .features-list {
    list-style: none;
    padding: 0;
    margin: 0 0 8mm 0;
  }
  .features-list li {
    font-size: 14px;
    color: #424245;
    padding: 3mm 0;
    display: flex;
    align-items: center;
    letter-spacing: -0.1px;
  }
  .features-list li::before {
    content: "";
    display: inline-block;
    width: 5px;
    height: 5px;
    background: #1d1d1f;
    border-radius: 50%;
    margin-right: 10px;
    flex-shrink: 0;
  }
  .cta-group {
    display: flex;
    align-items: center;
    gap: 6mm;
    margin-top: 4mm;
  }
  .cta-button {
    background: #1d1d1f;
    color: #ffffff;
    padding: 5mm 10mm;
    border-radius: 980px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.2px;
    display: inline-block;
  }
  .cta-link {
    color: #06c;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: -0.1px;
    text-decoration: none;
  }
  .stock-info {
    position: absolute;
    bottom: 10mm;
    right: 16mm;
    font-size: 11px;
    color: #6e6e73;
    letter-spacing: 0.3px;
  }
  @media print {
    body { background: #fff; padding: 0; }
    .a4-landscape { box-shadow: none; }
  }
  @media (max-width: 768px) {
    body { padding: 10px; }
    .a4-landscape {
      grid-template-columns: 1fr;
      aspect-ratio: 210 / 297;
    }
    .product-side { padding: 12mm; min-height: 80mm; }
    .info-side { padding: 12mm; }
    h1.hero-title { font-size: 44px; }
    .hero-subtitle { font-size: 20px; }
    .description { font-size: 15px; }
    .price-amount { font-size: 28px; }
  }
</style>
</head>
<body>
<article class="a4-landscape">
  <section class="product-side">
    <div class="product-badge"><span class="dot"></span>现货在售</div>
    <img class="product-image" src="/api/projects/3eeb22a8ecdd/images/f4424f21eebd51aa.jpg" alt="iPhone 18 Pro">
  </section>

  <section class="info-side">
    <div class="eyebrow">iPhone 18 Pro</div>
    <h1 class="hero-title">iPhone 18 Pro</h1>
    <p class="hero-subtitle">钛金属 · 全新登场</p>

    <div class="divider"></div>

    <p class="description">搭载全新 A20芯片，专业级影像系统再次突破。即刻拥有，开启下一段精彩。</p>

    <div class="price-grid">
      <div class="price-card">
        <div class="storage-label">256GB</div>
        <div class="price-amount"><span class="currency">¥</span>10,798</div>
      </div>
      <div class="price-card">
        <div class="storage-label">512GB</div>
        <div class="price-amount"><span class="currency">¥</span>12,798</div>
      </div>
    </div>

    <ul class="features-list">
      <li>全新未拆封 · 国行正品</li>
      <li>顺丰当日发货 · 全国联保</li>
      <li>支持以旧换新 · 分期免息</li>
    </ul>

    <div class="cta-group">
      <span class="cta-button">立即购买 ›</span>
      <span class="cta-link">了解更多 →</span>
    </div>

    <div class="stock-info">现货有限 · 售完即止</div>
  </section>
</article>
</body>
</html>
